# Reverse proxy for Numevi Beauty (Next.js app running in Docker on 127.0.0.1:3000)
#
# Install: sudo cp deploy/nginx/numevi-beauty.conf /etc/nginx/sites-available/numevi-beauty
#          sudo ln -s /etc/nginx/sites-available/numevi-beauty /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Then run: sudo certbot --nginx -d example.com -d www.example.com
# Certbot rewrites this file to add the SSL server block + HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
